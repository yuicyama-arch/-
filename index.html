<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0b0d10" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2714%27 fill=%27%23f2b532%27/%3E%3C/svg%3E" />
    <title>SCRAP RAID</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0b0d10;
        overflow: hidden;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      #game canvas {
        display: block;
      }
      /* 縦持ち時のオーバーレイ */
      #rotate-overlay {
        position: fixed;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #0b0d10;
        color: #e6edf3;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        z-index: 1000;
        text-align: center;
      }
      #rotate-overlay .phone {
        width: 48px;
        height: 84px;
        border: 3px solid #e6edf3;
        border-radius: 8px;
        animation: rotate-hint 1.6s ease-in-out infinite;
      }
      #rotate-overlay p {
        margin: 0;
        font-size: 18px;
        letter-spacing: 0.05em;
      }
      @keyframes rotate-hint {
        0%,
        30% {
          transform: rotate(0deg);
        }
        60%,
        100% {
          transform: rotate(90deg);
        }
      }
      @media (orientation: portrait) {
        #rotate-overlay {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate-overlay">
      <div class="phone"></div>
      <p>スマホを横にしてね</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
